name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Compile C to WebAssembly
        run: >
          emcc src/main.c -O2 -std=c99 -sASYNCIFY -sMODULARIZE=1
          -sEXPORT_NAME=createRailway -sEXIT_RUNTIME=1 -sFORCE_FILESYSTEM=1
          -sENVIRONMENT=web -sEXPORTED_RUNTIME_METHODS=FS,stringToUTF8,UTF8ToString
          -o web/railway.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
